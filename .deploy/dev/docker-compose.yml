name: trend-dev

volumes:
  trend_redis_data:

services:
  trend-redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - trend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  trend-api:
    image: ghcr.io/homeslands/trend-api:dev
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8087/api/${VERSION:-v1.0.0}/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    environment:
      # General
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      VERSION: ${VERSION}

      # Database
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}

      # Token
      SALT_ROUNDS: ${SALT_ROUNDS}
      DURATION: ${DURATION}
      REFRESHABLE_DURATION: ${REFRESHABLE_DURATION}

      # ACB Banking
      ACB_CLIENT_ID: ${ACB_CLIENT_ID}
      ACB_CLIENT_SECRET: ${ACB_CLIENT_SECRET}

      # Mail
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USER: ${MAIL_USER}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # Redis queue
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Otel lgtm
      OTEL_LGTM_URL: ${OTEL_LGTM_URL}

      # Session
      SESSION_SECRET: ${SESSION_SECRET}

      # ZaloOA
      ZALO_OA_API_KEY: ${ZALO_OA_API_KEY}
      ZALO_OA_SECRET_KEY: ${ZALO_OA_SECRET_KEY}
      ZALO_OA_ID: ${ZALO_OA_ID}

      # Google Maps
      GOOGLE_MAP_API_URL: ${GOOGLE_MAP_API_URL}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      CARD_ORDER_PAYMENT_TIMEOUT: ${CARD_ORDER_PAYMENT_TIMEOUT}

      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}

      # AWS
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET: ${AWS_BUCKET}

      #Proxy
      TRUST_PROXY_COUNT: ${TRUST_PROXY_COUNT}

      #QR payment point
      QR_TOKEN_TTL: ${QR_TOKEN_TTL}
      QR_ACTIVE_TTL: ${QR_ACTIVE_TTL}
      QR_IDEMPOTENT_TTL: ${QR_IDEMPOTENT_TTL}

      #HTTP
      SHARED_USER_API_URL: ${SHARED_USER_API_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

      #RabbitMQ
      RABBITMQ_URL: ${RABBITMQ_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

      TZ: Asia/Ho_Chi_Minh

    # deploy:
    #   replicas: 2
    #   update_config:
    #     parallelism: 1
    #     delay: 10s
    #   restart_policy:
    #     condition: on-failure

networks:
  default:
    external: true
    name: scoobydoo
